<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溢心捐赠平台 - 捐款去向详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .usage-item {
            border-left: 4px solid #e74c3c;
            padding-left: 15px;
            margin-bottom: 20px;
        }
        .proof-img {
            max-width: 200px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .proof-img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa fa-heart-o"></i> 溢心捐赠平台</a>
            <div class="navbar-nav ms-auto">
                <a href="donor-dashboard.html" class="nav-link">我的捐赠</a>
                <a href="index.html" class="nav-link">首页</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <div class="col-md-8">
                <!-- 捐赠信息 -->
                <div class="card mb-4">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fa fa-info-circle"></i> 捐赠信息</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="donationInfo">
                            <!-- 动态加载 -->
                        </div>
                    </div>
                </div>

                <!-- 捐款去向记录 -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fa fa-search"></i> 资金使用记录</h5>
                        <small class="text-muted">这笔捐款的具体使用情况</small>
                    </div>
                    <div class="card-body">
                        <div id="usageRecords">
                            <!-- 动态加载 -->
                        </div>
                        <div class="text-center py-4" id="loading">
                            <div class="spinner-border text-danger" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                        <div class="text-center py-4" id="noUsage" style="display: none;">
                            <div class="alert alert-info">
                                <i class="fa fa-info-circle"></i> 该笔捐款的去向记录正在登记中
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 侧边栏信息 -->
            <div class="col-md-4">
                <div class="card sticky-top" style="top: 20px;">
                    <div class="card-body">
                        <h6><i class="fa fa-lightbulb-o text-warning"></i> 捐款去向说明</h6>
                        <p class="small text-muted">机构会定期登记资金的具体使用情况，包括：</p>
                        <ul class="small text-muted">
                            <li>资金的具体用途</li>
                            <li>使用金额和时间</li>
                            <li>相关的凭证图片</li>
                            <li>审核状态</li>
                        </ul>
                        
                        <hr>
                        
                        <h6><i class="fa fa-clock-o text-info"></i> 时间线</h6>
                        <div class="timeline mt-3">
                            <div class="timeline-item">
                                <div class="timeline-marker bg-danger"></div>
                                <div class="timeline-content">
                                    <small class="text-muted">捐赠时间</small>
                                    <p class="mb-0" id="donationTime">--</p>
                                </div>
                            </div>
                            <div class="timeline-item">
                                <div class="timeline-marker bg-warning"></div>
                                <div class="timeline-content">
                                    <small class="text-muted">资金到账</small>
                                    <p class="mb-0">捐赠后实时到账</p>
                                </div>
                            </div>
                            <div class="timeline-item">
                                <div class="timeline-marker bg-primary"></div>
                                <div class="timeline-content">
                                    <small class="text-muted">使用登记</small>
                                    <p class="mb-0" id="usageTime">--</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片预览模态框 -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-body text-center">
                    <img id="previewImage" class="img-fluid" src="">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login-check.js"></script>
    <script>
        // 页面访问控制
        const user = getCurrentUser();
        if (!user || user.userType !== 'donor') {
            alert('请先以捐赠者身份登录');
            window.location.href = 'login.html?redirect=donation-usage.html';
        }

        // 从URL获取捐赠ID
        const urlParams = new URLSearchParams(window.location.search);
        const donationId = urlParams.get('donationId');

        if (!donationId) {
            alert('未指定捐赠记录');
            window.location.href = 'donor-dashboard.html';
        }

        // 模拟数据
        const usageDetailData = {
            donationInfo: {
                id: donationId,
                orderNo: donationId,
                projectTitle: '乡村教育助学计划',
                orgName: '中国乡村发展基金会',
                amount: 100.00,
                date: '2024-12-15 10:30:25',
                status: 'paid'
            },
            usageRecords: [
                {
                    id: 1,
                    description: '为XX县希望小学采购学习用品（书包、文具、作业本等）',
                    amount: 50.00,
                    date: '2024-12-20',
                    status: 'verified',
                    proof: 'https://picsum.photos/400/300?random=6',
                    proofName: '采购发票.jpg',
                    verifiedBy: '管理员',
                    verifiedAt: '2024-12-21 09:30:00'
                },
                {
                    id: 2,
                    description: '乡村教师培训课程费用',
                    amount: 30.00,
                    date: '2024-12-25',
                    status: 'submitted',
                    proof: null,
                    verifiedBy: null,
                    verifiedAt: null
                }
            ]
        };

        $(document).ready(function() {
            loadDonationDetail();
        });

        function loadDonationDetail() {
            setTimeout(() => {
                // 显示捐赠信息
                const info = usageDetailData.donationInfo;
                document.getElementById('donationInfo').innerHTML = `
                    <div class="col-md-6">
                        <p class="mb-2"><strong>项目名称：</strong>${info.projectTitle}</p>
                        <p class="mb-2"><strong>捐赠机构：</strong>${info.orgName}</p>
                        <p class="mb-2"><strong>捐赠金额：</strong><span class="text-danger fw-bold">¥${info.amount.toFixed(2)}</span></p>
                        <p class="mb-0"><strong>捐赠时间：</strong>${info.date}</p>
                    </div>
                    <div class="col-md-6">
                        <p class="mb-2"><strong>捐赠编号：</strong><code>${info.orderNo}</code></p>
                        <p class="mb-2"><strong>捐赠状态：</strong><span class="badge bg-success">已支付</span></p>
                        <p class="mb-2"><strong>去向登记：</strong><span class="badge bg-primary">${usageDetailData.usageRecords.length}条</span></p>
                    </div>
                `;
                
                // 更新时间线
                document.getElementById('donationTime').textContent = info.date.split(' ')[0];
                
                if (usageDetailData.usageRecords.length > 0) {
                    const lastUsage = usageDetailData.usageRecords[0];
                    document.getElementById('usageTime').textContent = lastUsage.date;
                }
                
                // 加载使用记录
                loadUsageRecords();
            }, 500);
        }

        function loadUsageRecords() {
            const container = document.getElementById('usageRecords');
            const loading = document.getElementById('loading');
            const noUsage = document.getElementById('noUsage');
            
            setTimeout(() => {
                loading.style.display = 'none';
                
                if (usageDetailData.usageRecords.length === 0) {
                    noUsage.style.display = 'block';
                    return;
                }
                
                usageDetailData.usageRecords.forEach(record => {
                    const usageItem = document.createElement('div');
                    usageItem.className = 'usage-item';
                    
                    let proofHtml = '';
                    if (record.proof) {
                        proofHtml = `
                        <div class="mt-3">
                            <p class="mb-2"><strong>凭证文件：</strong></p>
                            <a href="javascript:void(0)" onclick="previewImage('${record.proof}')">
                                <img src="${record.proof}" class="proof-img img-thumbnail" 
                                     alt="${record.proofName || '凭证图片'}" 
                                     title="点击查看大图">
                            </a>
                        </div>`;
                    }
                    
                    let verifiedHtml = '';
                    if (record.verifiedBy) {
                        verifiedHtml = `<p class="mb-1"><strong>审核人：</strong>${record.verifiedBy}</p>
                                      <p class="mb-0"><strong>审核时间：</strong>${record.verifiedAt}</p>`;
                    }
                    
                    usageItem.innerHTML = `
                        <h6>${record.description}</h6>
                        <div class="row">
                            <div class="col-md-6">
                                <p class="mb-1"><strong>使用金额：</strong>¥${record.amount.toFixed(2)}</p>
                                <p class="mb-1"><strong>使用日期：</strong>${record.date}</p>
                                <p class="mb-1"><strong>登记状态：</strong>
                                    <span class="badge ${getUsageStatusClass(record.status)}">
                                        ${getUsageStatusText(record.status)}
                                    </span>
                                </p>
                                ${verifiedHtml}
                            </div>
                        </div>
                        ${proofHtml}
                        <hr class="mt-3">
                    `;
                    
                    container.appendChild(usageItem);
                });
            }, 800);
        }

        function previewImage(src) {
            document.getElementById('previewImage').src = src;
            new bootstrap.Modal(document.getElementById('imagePreviewModal')).show();
        }

        function getUsageStatusClass(status) {
            switch(status) {
                case 'verified': return 'bg-success';
                case 'submitted': return 'bg-warning';
                case 'draft': return 'bg-secondary';
                default: return 'bg-secondary';
            }
        }

        function getUsageStatusText(status) {
            const statusMap = {
                'draft': '草稿',
                'submitted': '已提交',
                'verified': '已审核'
            };
            return statusMap[status] || status;
        }
    </script>
</body>
</html>
