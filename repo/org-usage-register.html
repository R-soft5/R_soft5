<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溢心捐赠平台 - 捐款去向登记</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa fa-heart-o"></i> 溢心捐赠平台</a>
            <div class="navbar-nav ms-auto">
                <a href="org-dashboard.html" class="nav-link">机构面板</a>
                <a href="org-usage-register.html" class="nav-link active">去向登记</a>
                <button class="btn btn-light ms-2" onclick="logout()">退出登录</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row">
            <!-- 左侧：可登记捐赠列表 -->
            <div class="col-md-8">
                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fa fa-list"></i> 可登记去向的捐赠</h5>
                        <small class="text-muted">选择捐赠记录进行资金去向登记</small>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover" id="donationsTable">
                                <thead>
                                    <tr>
                                        <th>捐赠编号</th>
                                        <th>捐赠者</th>
                                        <th>项目</th>
                                        <th>捐赠金额</th>
                                        <th>已登记</th>
                                        <th>剩余可登记</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="donationsList"></tbody>
                            </table>
                        </div>
                        <div class="text-center py-3" id="loading">
                            <div class="spinner-border text-danger" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                        <div class="text-center py-3" id="noData" style="display: none;">
                            <p class="text-muted">暂无需要登记去向的捐赠</p>
                        </div>
                    </div>
                </div>

                <!-- 历史登记记录 -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fa fa-history"></i> 历史登记记录</h5>
                    </div>
                    <div class="card-body">
                        <div id="historyList"></div>
                        <div class="text-center py-3" id="historyLoading">
                            <div class="spinner-border text-danger" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 右侧：登记表单 -->
            <div class="col-md-4">
                <div class="card sticky-top" style="top: 20px;">
                    <div class="card-header bg-danger text-white">
                        <h5 class="mb-0"><i class="fa fa-edit"></i> 登记捐款去向</h5>
                    </div>
                    <div class="card-body">
                        <form id="usageForm">
                            <div class="mb-3">
                                <label class="form-label">选择捐赠记录 <span class="text-danger">*</span></label>
                                <select class="form-select" id="donationSelect" required>
                                    <option value="">请选择捐赠记录</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">资金用途描述 <span class="text-danger">*</span></label>
                                <textarea class="form-control" id="usageDescription" rows="3" 
                                          placeholder="请详细描述资金的具体用途..." required></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">使用金额（元） <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="usageAmount" 
                                       min="0.01" step="0.01" placeholder="请输入使用金额" required>
                                <div class="form-text">剩余可登记金额：<span id="remainingAmount" class="text-danger fw-bold">0.00</span> 元</div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">使用日期 <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="usageDate" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">上传凭证（选填）</label>
                                <input type="file" class="form-control" id="proofFile" accept=".jpg,.jpeg,.png,.pdf">
                                <div class="form-text">支持上传发票、收据、签收单等，最大5MB</div>
                            </div>
                            
                            <button type="submit" class="btn donate-btn w-100" id="submitBtn">
                                <i class="fa fa-save"></i> 提交登记
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="login-check.js"></script>
    <script>
        // 页面访问控制
        const user = getCurrentUser();
        if (!user || user.userType !== 'org') {
            alert('请先以机构身份登录');
            window.location.href = 'org-login.html?redirect=org-usage-register.html';
        }

        // 设置默认日期
        document.getElementById('usageDate').value = new Date().toISOString().split('T')[0];

        // 捐赠数据
        const orgDonationsData = [
            {
                id: 1,
                orderNo: 'DON001',
                donorName: '张先生',
                projectTitle: '乡村教育助学计划',
                amount: 100.00,
                registered: 80.00
            },
            {
                id: 2,
                orderNo: 'DON002',
                donorName: '李女士',
                projectTitle: '大病医疗救助项目',
                amount: 200.00,
                registered: 0.00
            }
        ];

        // 登记历史数据
        const usageHistoryData = [
            {
                id: 1,
                description: '为希望小学采购学习用品',
                projectTitle: '乡村教育助学计划',
                amount: 50.00,
                date: '2024-12-20',
                status: 'verified'
            }
        ];

        let currentDonations = orgDonationsData;

        $(document).ready(function() {
            loadDonations();
            loadHistory();
        });

        function loadDonations() {
            $('#loading').hide();
            
            if (currentDonations.length === 0) {
                $('#noData').show();
                return;
            }
            
            $('#noData').hide();
            renderDonations(currentDonations);
        }

        function renderDonations(donations) {
            const tbody = $('#donationsList');
            const select = $('#donationSelect');
            
            tbody.empty();
            select.empty().append('<option value="">请选择捐赠记录</option>');
            
            donations.forEach(donation => {
                const remaining = donation.amount - donation.registered;
                
                // 表格行
                const row = `
                <tr>
                    <td><small>${donation.orderNo}</small></td>
                    <td>${donation.donorName}</td>
                    <td>${donation.projectTitle}</td>
                    <td class="fw-bold">¥${donation.amount.toFixed(2)}</td>
                    <td>¥${donation.registered.toFixed(2)}</td>
                    <td class="text-danger fw-bold">¥${remaining.toFixed(2)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="selectDonation(${donation.id})">
                            <i class="fa fa-edit"></i> 登记
                        </button>
                    </td>
                </tr>`;
                tbody.append(row);
                
                // 下拉选项
                select.append(`<option value="${donation.id}" 
                    data-amount="${donation.amount}" 
                    data-registered="${donation.registered}">
                    ${donation.orderNo} - ${donation.projectTitle} (剩余: ¥${remaining.toFixed(2)})
                </option>`);
            });
        }

        function selectDonation(donationId) {
            $('#donationSelect').val(donationId).trigger('change');
            $('html, body').animate({
                scrollTop: $("#usageForm").offset().top - 100
            }, 500);
        }

        $('#donationSelect').change(function() {
            const donationId = $(this).val();
            if (!donationId) {
                $('#remainingAmount').text('0.00');
                return;
            }
            
            const option = $(this).find('option:selected');
            const amount = parseFloat(option.data('amount'));
            const registered = parseFloat(option.data('registered'));
            const remaining = amount - registered;
            
            $('#remainingAmount').text(remaining.toFixed(2));
        });

        function loadHistory() {
            setTimeout(() => {
                $('#historyLoading').hide();
                
                if (usageHistoryData.length === 0) {
                    $('#historyList').html('<div class="alert alert-info">暂无登记记录</div>');
                    return;
                }
                
                renderHistory(usageHistoryData);
            }, 500);
        }

        function renderHistory(records) {
            const container = $('#historyList');
            
            records.forEach(record => {
                const card = `
                <div class="card mb-2 card-hover">
                    <div class="card-body p-3">
                        <div class="d-flex justify-content-between">
                            <div>
                                <h6 class="mb-1">${record.description.substring(0, 30)}...</h6>
                                <small class="text-muted">项目：${record.projectTitle}</small>
                            </div>
                            <div class="text-end">
                                <span class="badge ${getUsageStatusClass(record.status)}">
                                    ${getUsageStatusText(record.status)}
                                </span>
                                <div class="mt-1">
                                    <small class="text-danger fw-bold">¥${record.amount.toFixed(2)}</small>
                                </div>
                            </div>
                        </div>
                        <small class="text-muted">${record.date}</small>
                    </div>
                </div>`;
                container.append(card);
            });
        }

        $('#usageForm').submit(function(e) {
            e.preventDefault();
            
            const donationId = $('#donationSelect').val();
            const description = $('#usageDescription').val();
            const amount = $('#usageAmount').val();
            const date = $('#usageDate').val();
            
            if (!donationId) {
                alert('请选择捐赠记录');
                return;
            }
            
            // 验证金额
            const option = $('#donationSelect').find('option:selected');
            const maxAmount = parseFloat(option.data('amount')) - parseFloat(option.data('registered'));
            if (parseFloat(amount) > maxAmount) {
                alert(`登记金额不能超过剩余可登记金额 ¥${maxAmount.toFixed(2)}`);
                return;
            }
            
            const submitBtn = $('#submitBtn');
            submitBtn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> 提交中...');
            
            setTimeout(() => {
                alert('登记成功！');
                $('#usageForm')[0].reset();
                document.getElementById('usageDate').value = new Date().toISOString().split('T')[0];
                
                // 更新数据
                const index = currentDonations.findIndex(d => d.id == donationId);
                if (index !== -1) {
                    currentDonations[index].registered += parseFloat(amount);
                }
                
                loadDonations();
                loadHistory();
                
                submitBtn.prop('disabled', false).html('<i class="fa fa-save"></i> 提交登记');
            }, 1000);
        });

        function getUsageStatusClass(status) {
            switch(status) {
                case 'verified': return 'bg-success';
                case 'submitted': return 'bg-warning';
                case 'draft': return 'bg-secondary';
                default: return 'bg-secondary';
            }
        }

        function getUsageStatusText(status) {
            const statusMap = {
                'draft': '草稿',
                'submitted': '已提交',
                'verified': '已审核'
            };
            return statusMap[status] || status;
        }
    </script>
</body>
</html>
