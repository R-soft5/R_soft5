<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>益心捐赠平台 - 统一注册</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .role-tabs {
            display: flex;
            border-bottom: 1px solid #dee2e6;
            margin-bottom: 20px;
        }
        .role-tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            cursor: pointer;
            background-color: #f8f9fa;
            border: none;
            font-size: 1.1rem;
            transition: all 0.3s;
        }
        .role-tab.active {
            background-color: white;
            border-bottom: 3px solid #e74c3c;
            font-weight: bold;
            color: #e74c3c;
        }
        .role-tab:hover:not(.active) {
            background-color: #e9ecef;
        }
        .form-section {
            display: none;
            animation: fadeIn 0.5s;
        }
        .form-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 30px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-heart-o"></i> 益心捐赠平台
            </a>
            <div class="navbar-nav ms-auto">
                <a href="index.html" class="nav-link">返回首页</a>
                <a href="login.html" class="nav-link">登录</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card register-card">
            <div class="card-header bg-danger text-white text-center">
                <h4 class="mb-0"><i class="fa fa-user-plus"></i> 用户注册</h4>
                <p class="mb-0 mt-1">请选择您的身份类型完成注册</p>
            </div>
            <div class="card-body p-4">
                
                <!-- 身份选择标签页 -->
                <div class="role-tabs">
                    <button class="role-tab active" data-target="donor-form">
                        <div class="d-flex align-items-center justify-content-center">
                            <span class="icon-container"><i class="fa fa-user"></i></span>
                            <span>捐赠者注册</span>
                        </div>
                    </button>
                    <button class="role-tab" data-target="org-form">
                        <div class="d-flex align-items-center justify-content-center">
                            <span class="icon-container"><i class="fa fa-building"></i></span>
                            <span>机构注册</span>
                        </div>
                    </button>
                </div>

                <!-- 捐赠者注册表单 -->
                <div id="donor-form" class="form-section active">
                    <form id="donorRegisterForm">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regDonorPhone" class="form-label">手机号</label>
                                <div class="input-group">
                                    <span class="input-group-text icon-container">
                                        <i class="fa fa-mobile"></i>
                                    </span>
                                    <input type="tel" class="form-control" id="regDonorPhone" 
                                           placeholder="请输入手机号" pattern="[0-9]{11}" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="donorCode" class="form-label">验证码</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="donorCode" 
                                           placeholder="请输入验证码" maxlength="6" required>
                                    <button type="button" class="btn btn-outline-secondary" id="sendDonorCode">
                                        获取验证码
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="regDonorPwd" class="form-label">设置密码</label>
                            <div class="input-group">
                                <span class="input-group-text icon-container">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="regDonorPwd" 
                                       placeholder="请设置6-16位密码" minlength="6" maxlength="16" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmDonorPwd" class="form-label">确认密码</label>
                            <div class="input-group">
                                <span class="input-group-text icon-container">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="confirmDonorPwd" 
                                       placeholder="请再次输入密码" required>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="agreeDonor" required>
                            <label class="form-check-label" for="agreeDonor">
                                我已阅读并同意<a href="#" class="text-danger">《用户注册协议》</a>和
                                <a href="#" class="text-danger">《隐私政策》</a>
                            </label>
                        </div>
                        <button type="submit" class="btn donate-btn w-100">
                            <i class="fa fa-user-plus"></i> 注册为捐赠者
                        </button>
                    </form>
                </div>

                <!-- 机构注册表单 -->
                <div id="org-form" class="form-section">
                    <form id="orgRegisterForm">
                        <div class="mb-3">
                            <label for="orgName" class="form-label">机构名称</label>
                            <div class="input-group">
                                <span class="input-group-text icon-container">
                                    <i class="fa fa-building"></i>
                                </span>
                                <input type="text" class="form-control" id="orgName" 
                                       placeholder="请输入机构全称" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="regOrgPhone" class="form-label">负责人手机号</label>
                                <div class="input-group">
                                    <span class="input-group-text icon-container">
                                        <i class="fa fa-mobile"></i>
                                    </span>
                                    <input type="tel" class="form-control" id="regOrgPhone" 
                                           placeholder="请输入负责人手机号" pattern="[0-9]{11}" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="orgCode" class="form-label">验证码</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="orgCode" 
                                           placeholder="请输入验证码" maxlength="6" required>
                                    <button type="button" class="btn btn-outline-secondary" id="sendOrgCode">
                                        获取验证码
                                    </button>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="orgLicense" class="form-label">机构资质证书编号</label>
                            <div class="input-group">
                                <span class="input-group-text icon-container">
                                    <i class="fa fa-certificate"></i>
                                </span>
                                <input type="text" class="form-control" id="orgLicense" 
                                       placeholder="请输入公益组织登记证书编号" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="regOrgPwd" class="form-label">设置密码</label>
                            <div class="input-group">
                                <span class="input-group-text icon-container">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="regOrgPwd" 
                                       placeholder="请设置6-16位密码" minlength="6" maxlength="16" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="confirmOrgPwd" class="form-label">确认密码</label>
                            <div class="input-group">
                                <span class="input-group-text icon-container">
                                    <i class="fa fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="confirmOrgPwd" 
                                       placeholder="请再次输入密码" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">上传资质证明</label>
                            <input class="form-control" type="file" id="orgFile" 
                                   accept=".jpg,.jpeg,.png,.pdf" multiple required>
                            <div class="form-text">请上传营业执照/公益组织登记证书等扫描件</div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="agreeOrg" required>
                            <label class="form-check-label" for="agreeOrg">
                                我已阅读并同意<a href="#" class="text-danger">《机构入驻协议》</a>和
                                <a href="#" class="text-danger">《隐私政策》</a>
                            </label>
                        </div>
                        <button type="submit" class="btn donate-btn w-100">
                            <i class="fa fa-building"></i> 提交机构注册申请
                        </button>
                    </form>
                </div>

            </div>
            <div class="card-footer text-center text-muted">
                <p class="mb-0">已有账号？<a href="login.html" class="text-danger">立即登录</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login-check.js"></script>
    <script>
        // 身份切换功能
        document.querySelectorAll('.role-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.role-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
                
                this.classList.add('active');
                const targetId = this.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });

        // 捐赠者注册验证码
        document.getElementById('sendDonorCode').addEventListener('click', function() {
            const phone = document.getElementById('regDonorPhone').value;
            if (!phone) {
                alert('请先输入手机号');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的手机号');
                return;
            }
            
            startCountdown(this);
            alert('验证码已发送至您的手机：123456（模拟验证码）');
        });

        // 机构注册验证码
        document.getElementById('sendOrgCode').addEventListener('click', function() {
            const phone = document.getElementById('regOrgPhone').value;
            if (!phone) {
                alert('请先输入负责人手机号');
                return;
            }
            
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的手机号');
                return;
            }
            
            startCountdown(this);
            alert('验证码已发送至您的手机：123456（模拟验证码）');
        });

        // 捐赠者注册提交
        document.getElementById('donorRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('regDonorPhone').value;
            const pwd = document.getElementById('regDonorPwd').value;
            const confirmPwd = document.getElementById('confirmDonorPwd').value;
            
            if (pwd !== confirmPwd) {
                alert('两次输入的密码不一致');
                return;
            }
            
            if (pwd.length < 6) {
                alert('密码长度至少6位');
                return;
            }
            
            // 保存用户信息
            const userData = {
                userId: 'DON' + Date.now().toString().slice(-8),
                phone: phone,
                userType: 'donor',
                registerTime: new Date().toISOString()
            };
            
            // 保存到localStorage
            let users = JSON.parse(localStorage.getItem('users') || '[]');
            users.push(userData);
            localStorage.setItem('users', JSON.stringify(users));
            
            alert('捐赠者注册成功！即将跳转到登录页');
            window.location.href = 'login.html';
        });

        // 机构注册提交
        document.getElementById('orgRegisterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const orgName = document.getElementById('orgName').value;
            const phone = document.getElementById('regOrgPhone').value;
            const pwd = document.getElementById('regOrgPwd').value;
            const confirmPwd = document.getElementById('confirmOrgPwd').value;
            
            if (pwd !== confirmPwd) {
                alert('两次输入的密码不一致');
                return;
            }
            
            if (pwd.length < 6) {
                alert('密码长度至少6位');
                return;
            }
            
            // 保存机构信息
            const orgData = {
                orgId: 'ORG' + Date.now().toString().slice(-8),
                orgName: orgName,
                phone: phone,
                license: document.getElementById('orgLicense').value,
                userType: 'org',
                status: 'pending',
                registerTime: new Date().toISOString()
            };
            
            // 保存到localStorage
            let orgs = JSON.parse(localStorage.getItem('orgs') || '[]');
            orgs.push(orgData);
            localStorage.setItem('orgs', JSON.stringify(orgs));
            
            alert('机构注册申请已提交！审核通过后将短信通知您。即将返回首页');
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
