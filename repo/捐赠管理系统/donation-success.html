<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溢心捐赠平台 - 捐赠成功</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background-color: #f8f9fa; }
        .success-card { max-width: 600px; margin: 50px auto; }
        .success-icon { font-size: 4rem; color: #28a745; }
        .info-card { background-color: #f8f9fa; border-left: 4px solid #e74c3c; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #e74c3c;">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-heart-o"></i> 溢心捐赠平台
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card success-card shadow">
            <div class="card-body text-center py-5">
                <!-- 成功图标 -->
                <div class="success-icon mb-4">
                    <i class="fa fa-check-circle"></i>
                </div>
                
                <!-- 成功标题 -->
                <h2 class="text-success mb-3">捐赠成功！</h2>
                <p class="text-muted mb-4">感谢您的爱心捐赠，您的善款将为需要帮助的人带来温暖和希望</p>
                
                <!-- 捐赠信息卡片 -->
                <div class="card info-card mb-4 text-start">
                    <div class="card-body">
                        <h5 class="card-title mb-3"><i class="fa fa-info-circle text-danger"></i> 捐赠详情</h5>
                        <div id="donationInfo">
                            <!-- 动态加载 -->
                        </div>
                    </div>
                </div>
                
                <!-- 去向追踪信息 -->
                <div class="alert alert-info text-start mb-4">
                    <h6><i class="fa fa-search"></i> 捐款去向追踪</h6>
                    <p class="mb-2">您捐赠的资金去向将被全程记录和公示：</p>
                    <ul class="mb-0">
                        <li>机构将定期登记资金使用情况</li>
                        <li>可随时查看资金用途和凭证</li>
                        <li>确保每一分善款透明使用</li>
                    </ul>
                </div>
                
                <!-- 操作按钮 -->
                <div class="d-grid gap-3 col-md-8 mx-auto">
                    <button onclick="viewDonationUsage()" class="btn btn-primary btn-lg">
                        <i class="fa fa-search"></i> 查询这笔捐款的去向
                    </button>
                    <button onclick="viewAllDonations()" class="btn btn-outline-primary btn-lg">
                        <i class="fa fa-list"></i> 查看我的所有捐赠
                    </button>
                    <button onclick="goToHome()" class="btn btn-light btn-lg">
                        <i class="fa fa-home"></i> 返回首页继续捐赠
                    </button>
                </div>
                
                <!-- 温馨提示 -->
                <div class="mt-4 text-muted small">
                    <p class="mb-1">如有任何疑问，请联系客服：XXX-XXX-XXXX</p>
                    <p>捐赠发票将在7个工作日内发送至您的邮箱</p>
                </div>
            </div>
        </div>
    </div>

    <script src="login-check.js"></script>
    <script>
        // 从URL参数获取捐赠信息
        const urlParams = new URLSearchParams(window.location.search);
        const donationId = urlParams.get('donationId') || 'DON' + Date.now().toString().slice(-8);
        const projectName = urlParams.get('project') || '捐赠项目';
        const amount = urlParams.get('amount') || '0.00';
        const projectId = urlParams.get('projectId') || '1';
        
        // 显示捐赠信息
        document.getElementById('donationInfo').innerHTML = `
            <div class="row">
                <div class="col-6">
                    <p class="mb-2"><strong>捐赠编号：</strong></p>
                    <p class="mb-2"><strong>项目名称：</strong></p>
                    <p class="mb-2"><strong>捐赠金额：</strong></p>
                    <p class="mb-0"><strong>捐赠时间：</strong></p>
                </div>
                <div class="col-6">
                    <p class="mb-2 text-danger fw-bold">${donationId}</p>
                    <p class="mb-2">${projectName}</p>
                    <p class="mb-2 text-danger fw-bold">¥${parseFloat(amount).toFixed(2)}</p>
                    <p class="mb-0">${new Date().toLocaleString()}</p>
                </div>
            </div>
        `;
        
        // 查询该笔捐款的去向
        function viewDonationUsage() {
            if (isLoggedIn()) {
                // 跳转到该笔捐赠的去向详情页
                window.location.href = `donor-dashboard.html?donation=${donationId}`;
            } else {
                alert('请先登录以查看捐款去向');
                window.location.href = `login.html?redirect=donor-dashboard.html&donationId=${donationId}`;
            }
        }
        
        // 查看所有捐赠
        function viewAllDonations() {
            if (isLoggedIn()) {
                window.location.href = 'donor-dashboard.html';
            } else {
                alert('请先登录以查看捐赠记录');
                window.location.href = 'login.html?redirect=donor-dashboard.html';
            }
        }
        
        // 返回首页
        function goToHome() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
