<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溢心捐赠平台 - 我的捐赠</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .status-badge { font-size: 0.8rem; }
        .donation-card { transition: transform 0.3s; }
        .donation-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa fa-heart-o"></i> 溢心捐赠平台</a>
            <div class="navbar-nav ms-auto">
                <a href="index.html" class="nav-link">首页</a>
                <a href="donor-dashboard.html" class="nav-link active">我的捐赠</a>
                <button class="btn btn-light ms-2" onclick="logout()">退出登录</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="mb-4"><i class="fa fa-heart"></i> 我的捐赠记录</h2>
        
        <!-- 统计信息 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h3 class="text-danger" id="totalAmount">¥0</h3>
                        <small>累计捐赠</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h3 class="text-success" id="totalCount">0</h3>
                        <small>捐赠次数</small>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-light">
                    <div class="card-body text-center">
                        <h3 class="text-info" id="projectsCount">0</h3>
                        <small>支持项目</small>
                    </div>
                </div>
            </div>
        </div>

        <!-- 捐赠记录列表 -->
        <div class="card">
            <div class="card-header bg-white">
                <h5 class="mb-0">捐赠历史</h5>
            </div>
            <div class="card-body">
                <div id="loading" class="text-center py-4">
                    <div class="spinner-border text-danger" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                </div>
                <div id="noData" class="text-center py-4" style="display: none;">
                    <p class="text-muted">暂无捐赠记录</p>
                    <a href="index.html" class="btn donate-btn">去捐赠</a>
                </div>
                <div id="donationsList" class="row g-3">
                    <!-- 通过JS动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 捐款去向详情模态框 -->
    <div class="modal fade" id="usageDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">捐款去向详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="usageContent">
                    <!-- 动态加载 -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="login-check.js"></script>
    <script>
        // 页面访问控制
        const user = getCurrentUser();
        if (!user || user.userType !== 'donor') {
            alert('请先以捐赠者身份登录');
            window.location.href = 'login.html?redirect=donor-dashboard.html';
        }

        // 捐赠记录数据
        const donationsData = [
            {
                id: 1,
                orderNo: 'DON' + Date.now().toString().slice(-8),
                projectId: 1,
                projectTitle: "乡村教育助学计划",
                orgName: "中国乡村发展基金会",
                amount: 100.00,
                date: "2024-12-15 10:30:25",
                status: "paid",
                usageCount: 2,
                cover: "https://picsum.photos/100/80?random=1"
            },
            {
                id: 2,
                orderNo: 'DON' + (Date.now() - 86400000).toString().slice(-8),
                projectId: 2,
                projectTitle: "大病医疗救助项目",
                orgName: "中国残疾人福利基金会",
                amount: 200.00,
                date: "2024-12-10 14:20:15",
                status: "paid",
                usageCount: 1,
                cover: "https://picsum.photos/100/80?random=2"
            }
        ];

        // 捐款去向数据
        const usageData = {
            1: [
                {
                    id: 1,
                    description: "为XX县希望小学采购学习用品（书包、文具等）",
                    amount: 50.00,
                    date: "2024-12-20",
                    status: "verified",
                    proof: "https://picsum.photos/200/150?random=4"
                },
                {
                    id: 2,
                    description: "乡村教师培训课程费用",
                    amount: 30.00,
                    date: "2024-12-25",
                    status: "submitted",
                    proof: null
                }
            ],
            2: [
                {
                    id: 3,
                    description: "为重病患者张先生提供医疗补贴",
                    amount: 200.00,
                    date: "2024-12-18",
                    status: "verified",
                    proof: "https://picsum.photos/200/150?random=5"
                }
            ]
        };

        $(document).ready(function() {
            loadDonations();
        });

        function loadDonations() {
            setTimeout(() => {
                if (donationsData.length === 0) {
                    $('#loading').hide();
                    $('#noData').show();
                    return;
                }
                
                $('#loading').hide();
                renderDonations(donationsData);
                updateStatistics(donationsData);
            }, 800);
        }

        function renderDonations(donations) {
            const container = $('#donationsList');
            
            donations.forEach(donation => {
                const card = `
                <div class="col-md-6">
                    <div class="card donation-card h-100">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-3">
                                    <img src="${donation.cover}" class="img-fluid rounded" alt="项目封面">
                                </div>
                                <div class="col-9">
                                    <h6 class="fw-bold">${donation.projectTitle}</h6>
                                    <p class="text-muted small mb-2">${donation.orgName}</p>
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span class="text-danger fw-bold">¥${donation.amount.toFixed(2)}</span>
                                        <span class="badge ${getStatusClass(donation.status)}">
                                            ${getStatusText(donation.status)}
                                        </span>
                                    </div>
                                    <p class="small text-muted mb-2">${donation.date}</p>
                                    <div class="d-flex justify-content-between">
                                        <small class="text-muted">订单号：${donation.orderNo}</small>
                                        <button class="btn btn-sm btn-outline-primary" onclick="viewUsage(${donation.id})" 
                                                ${donation.usageCount > 0 ? '' : 'disabled'}>
                                            <i class="fa fa-search"></i> 查看去向
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
                container.append(card);
            });
        }

        function updateStatistics(donations) {
            const totalAmount = donations.reduce((sum, d) => sum + d.amount, 0);
            const projects = [...new Set(donations.map(d => d.projectId))];
            
            $('#totalAmount').text('¥' + totalAmount.toFixed(2));
            $('#totalCount').text(donations.length);
            $('#projectsCount').text(projects.length);
        }

        function viewUsage(donationId) {
            const donation = donationsData.find(d => d.id === donationId);
            if (!donation) return;
            
            const usageRecords = usageData[donationId] || [];
            
            let html = `
                <div class="mb-4">
                    <h6>捐赠信息</h6>
                    <div class="card bg-light">
                        <div class="card-body">
                            <p><strong>项目：</strong>${donation.projectTitle}</p>
                            <p><strong>机构：</strong>${donation.orgName}</p>
                            <p><strong>捐赠金额：</strong>¥${donation.amount.toFixed(2)}</p>
                            <p><strong>捐赠时间：</strong>${donation.date}</p>
                        </div>
                    </div>
                </div>`;
            
            if (usageRecords.length === 0) {
                html += '<div class="alert alert-info">暂无捐款去向登记</div>';
            } else {
                html += '<h6 class="mb-3">资金使用记录</h6>';
                
                usageRecords.forEach(record => {
                    html += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <h6>${record.description}</h6>
                                    <p class="mb-1"><strong>使用金额：</strong>¥${record.amount.toFixed(2)}</p>
                                    <p class="mb-1"><strong>使用日期：</strong>${record.date}</p>
                                    <p class="mb-1"><strong>状态：</strong>
                                        <span class="badge ${getUsageStatusClass(record.status)}">
                                            ${getUsageStatusText(record.status)}
                                        </span>
                                    </p>
                                </div>`;
                    
                    if (record.proof) {
                        html += `
                                <div class="col-md-4">
                                    <p class="mb-2"><strong>凭证：</strong></p>
                                    <a href="${record.proof}" target="_blank">
                                        <img src="${record.proof}" class="img-thumbnail w-100" style="cursor: pointer;">
                                    </a>
                                </div>`;
                    }
                    
                    html += `</div></div></div>`;
                });
            }
            
            $('#usageContent').html(html);
            new bootstrap.Modal(document.getElementById('usageDetailModal')).show();
        }

        function getStatusClass(status) {
            const classes = {
                'paid': 'bg-success',
                'pending': 'bg-warning',
                'failed': 'bg-danger',
                'refunded': 'bg-secondary'
            };
            return classes[status] || 'bg-secondary';
        }

        function getStatusText(status) {
            const texts = {
                'pending': '待支付',
                'paid': '已支付',
                'failed': '支付失败',
                'refunded': '已退款'
            };
            return texts[status] || status;
        }

        function getUsageStatusClass(status) {
            const classes = {
                'verified': 'bg-success',
                'submitted': 'bg-warning',
                'draft': 'bg-secondary'
            };
            return classes[status] || 'bg-secondary';
        }

        function getUsageStatusText(status) {
            const texts = {
                'draft': '草稿',
                'submitted': '已提交',
                'verified': '已审核'
            };
            return texts[status] || status;
        }
    </script>
</body>
</html>
