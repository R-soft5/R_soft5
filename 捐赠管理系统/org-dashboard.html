<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>溢心捐赠平台 - 机构面板</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .stat-card {
            border-radius: 8px;
            transition: transform 0.3s;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .nav-pills .nav-link.active {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa fa-heart-o"></i> 溢心捐赠平台</a>
            <div class="navbar-nav ms-auto">
                <a href="org-dashboard.html" class="nav-link active">机构面板</a>
                <a href="org-usage-register.html" class="nav-link">去向登记</a>
                <button class="btn btn-light ms-2" onclick="logout()">退出登录</button>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <!-- 欢迎信息 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card bg-light">
                    <div class="card-body">
                        <h3 id="welcomeTitle">欢迎，公益机构</h3>
                        <p class="text-muted mb-0">在这里管理您的项目和捐赠记录</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="row mb-5">
            <div class="col-md-3">
                <div class="card stat-card bg-primary text-white">
                    <div class="card-body text-center">
                        <h4 class="fw-bold" id="totalProjects">0</h4>
                        <p class="mb-0">总项目数</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-success text-white">
                    <div class="card-body text-center">
                        <h4 class="fw-bold" id="totalDonations">0</h4>
                        <p class="mb-0">总捐赠数</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-warning text-white">
                    <div class="card-body text-center">
                        <h4 class="fw-bold" id="totalAmount">¥0</h4>
                        <p class="mb-0">筹款总额</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-info text-white">
                    <div class="card-body text-center">
                        <h4 class="fw-bold" id="usageCount">0</h4>
                        <p class="mb-0">登记记录</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 功能导航 -->
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="fa fa-plus-circle fa-3x text-danger"></i>
                        </div>
                        <h5>创建新项目</h5>
                        <p class="text-muted">发起新的筹款项目</p>
                        <button class="btn donate-btn" onclick="createProject()">创建项目</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="fa fa-list fa-3x text-primary"></i>
                        </div>
                        <h5>项目管理</h5>
                        <p class="text-muted">查看和管理所有项目</p>
                        <button class="btn btn-outline-primary" onclick="manageProjects()">管理项目</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body text-center">
                        <div class="mb-3">
                            <i class="fa fa-file-text fa-3x text-success"></i>
                        </div>
                        <h5>捐赠记录</h5>
                        <p class="text-muted">查看所有捐赠详情</p>
                        <a href="org-usage-register.html" class="btn btn-outline-success">查看记录</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 最近捐赠 -->
        <div class="card mt-4">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="fa fa-history"></i> 最近的捐赠</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>捐赠者</th>
                                <th>项目</th>
                                <th>金额</th>
                                <th>时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="recentDonations">
                            <!-- 动态加载 -->
                        </tbody>
                    </table>
                </div>
                <div class="text-center" id="noDonations" style="display: none;">
                    <p class="text-muted">暂无捐赠记录</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建项目模态框 -->
    <div class="modal fade" id="createProjectModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建新项目</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <div class="mb-3">
                            <label class="form-label">项目标题</label>
                            <input type="text" class="form-control" placeholder="输入项目标题" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">项目描述</label>
                            <textarea class="form-control" rows="3" placeholder="详细描述项目内容" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">目标金额（元）</label>
                            <input type="number" class="form-control" min="100" step="100" required>
                        </div>
                        <button type="submit" class="btn donate-btn w-100">创建项目</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login-check.js"></script>
    <script>
        // 页面访问控制
        const user = getCurrentUser();
        if (!user || user.userType !== 'org') {
            alert('请先以机构身份登录');
            window.location.href = 'org-login.html?redirect=org-dashboard.html';
        }

        // 更新欢迎信息
        document.getElementById('welcomeTitle').textContent = `欢迎，${user.orgName || '公益机构'}`;

        // 模拟数据
        const orgData = {
            totalProjects: 2,
            totalDonations: 15,
            totalAmount: 3500,
            usageCount: 3,
            recentDonations: [
                { donor: '张先生', project: '乡村教育助学计划', amount: 100, date: '2024-12-15 10:30', status: 'paid' },
                { donor: '李女士', project: '大病医疗救助项目', amount: 200, date: '2024-12-14 14:20', status: 'paid' },
                { donor: '王先生', project: '乡村教育助学计划', amount: 50, date: '2024-12-13 09:15', status: 'paid' }
            ]
        };

        $(document).ready(function() {
            loadDashboardData();
        });

        function loadDashboardData() {
            // 更新统计数据
            document.getElementById('totalProjects').textContent = orgData.totalProjects;
            document.getElementById('totalDonations').textContent = orgData.totalDonations;
            document.getElementById('totalAmount').textContent = '¥' + orgData.totalAmount.toFixed(2);
            document.getElementById('usageCount').textContent = orgData.usageCount;
            
            // 加载最近捐赠
            loadRecentDonations();
        }

        function loadRecentDonations() {
            const tbody = document.getElementById('recentDonations');
            const noData = document.getElementById('noDonations');
            
            if (orgData.recentDonations.length === 0) {
                tbody.innerHTML = '';
                noData.style.display = 'block';
                return;
            }
            
            noData.style.display = 'none';
            tbody.innerHTML = '';
            
            orgData.recentDonations.forEach(donation => {
                const row = `
                <tr>
                    <td>${donation.donor}</td>
                    <td>${donation.project}</td>
                    <td class="fw-bold text-danger">¥${donation.amount.toFixed(2)}</td>
                    <td>${donation.date}</td>
                    <td><span class="badge bg-success">已支付</span></td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function createProject() {
            new bootstrap.Modal(document.getElementById('createProjectModal')).show();
        }

        function manageProjects() {
            alert('项目管理功能开发中...');
        }

        // 提交项目表单
        document.getElementById('projectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('项目创建成功！');
            document.getElementById('projectForm').reset();
            bootstrap.Modal.getInstance(document.getElementById('createProjectModal')).hide();
        });
    </script>
</body>
</html>
